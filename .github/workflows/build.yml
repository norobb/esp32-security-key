name: "Build"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.esp_product }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - esp_product: esp32s2
            esp_name: ESP32-S2
          - esp_product: esp32s3
            esp_name: ESP32-S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Install ESP-IDF
        run: |
          git clone --recursive https://github.com/espressif/esp-idf.git -b v5.5 --depth=1
          cd esp-idf
          ./install.sh ${{ matrix.esp_product }}

      - name: Build firmware
        run: |
          . ./esp-idf/export.sh
          idf.py set-target ${{ matrix.esp_product }}
          idf.py all
          cd build
          esptool.py --chip ${{ matrix.esp_name }} merge_bin -o pico_fido_esp32.bin @flash_args

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico_fido_esp32_${{ matrix.esp_product }}
          path: build/pico_fido_esp32.bin
