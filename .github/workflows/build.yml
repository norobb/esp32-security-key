name: "Build"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.esp_product }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - esp_product: esp32s2
            esp_name: ESP32-S2
          - esp_product: esp32s3
            esp_name: ESP32-S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build firmware with ESP-IDF
        uses: espressif/idf-action@v1
        with:
          esp_idf_version: 'v5.5'
          target: ${{ matrix.esp_product }}
          command: |
            idf.py set-target ${{ matrix.esp_product }}
            idf.py all
            cd build
            esptool.py --chip ${{ matrix.esp_name }} merge_bin -o pico_fido_esp32.bin @flash_args

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico_fido_esp32_${{ matrix.esp_product }}
          path: build/pico_fido_esp32.bin
